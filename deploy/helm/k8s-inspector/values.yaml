replicaCount: 1

image:
  repository: ghcr.io/lwj-st/k8s-inspector
  pullPolicy: Always
  tag: latest

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - host: dev-inspector.sensecore.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: sensecore-tls
      hosts:
        - dev-inspector.sensecore.com

basePath: ""

env:
  appEnv: production
  clusterId: change-me
  databaseUrl: sqlite:////data/k8s_inspector.db
  providerMode: kubernetes
  preferIncluster: true
  k8sRequestTimeout: 10
  llmEnabled: false
  llmProvider: qwen
  modelEndpoint: ""
  kubeContext: ""
  authMode: local
  sessionCookieName: k8s_inspector_session
  sessionIdleMinutes: 30
  sessionAbsoluteHours: 8
  sessionCookieSecure: true
  loginFailureLimit: 5
  loginFailureWindowMinutes: 10
  trustedDetailBaseUrl: ""
  webhookAllowedHosts: []
  webhookAllowedCidrs: []

secretEnv:
  apiKey: ""
  adminUsername: ""
  adminPasswordHash: ""
  sessionSecret: ""
  configEncryptionKey: ""

persistence:
  enabled: true
  mountPath: /data
  size: 512Mi
  accessModes:
    - ReadWriteOnce
  storageClass: ""
  existingClaim: ""
  annotations: {}

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}

rbac:
  create: true

readinessProbe:
  httpGet:
    path: ""
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

livenessProbe:
  httpGet:
    path: ""
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20
