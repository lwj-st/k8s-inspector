apiVersion: v1
kind: Secret
metadata:
  name: {{ include "k8s-inspector.fullname" . }}
  labels:
    {{- include "k8s-inspector.labels" . | nindent 4 }}
type: Opaque
stringData:
  API_KEY: {{ .Values.secretEnv.apiKey | quote }}
  ADMIN_USERNAME: {{ .Values.secretEnv.adminUsername | quote }}
  ADMIN_PASSWORD_HASH: {{ .Values.secretEnv.adminPasswordHash | quote }}
  SESSION_SECRET: {{ .Values.secretEnv.sessionSecret | quote }}
  CONFIG_ENCRYPTION_KEY: {{ .Values.secretEnv.configEncryptionKey | quote }}
